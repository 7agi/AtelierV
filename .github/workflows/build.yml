name: Build & Release AtelierV Suite

on:
  push:
    branches: [ "main", "master", "v1.2", "v*" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master", "v1.2", "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Complete Windows Suite
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Release Binary
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --bin atelier-v

      - name: Package Unified Suite
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/atelier-v.exe dist/
          [ -f run.bat ] && cp run.bat dist/ || true
          [ -f run-admin.bat ] && cp run-admin.bat dist/ || true
          [ -f run-admin-cli.bat ] && cp run-admin-cli.bat dist/ || true
          [ -f README.md ] && cp README.md dist/ || true

      - name: Upload Unified Suite Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atelierv-suite-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Release to GitHub Releases (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/atelier-v.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}