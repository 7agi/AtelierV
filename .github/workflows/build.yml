name: Build & Release AtelierV Suite

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Complete Windows Suite
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile All Release Binaries
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --bin atelierv
          cargo build --release --target x86_64-pc-windows-msvc --bin atelierv-admin
          cargo build --release --target x86_64-pc-windows-msvc --bin atelierv-admin-cli

      - name: Package Unified Suite
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/atelierv.exe dist/
          cp target/x86_64-pc-windows-msvc/release/atelierv-admin.exe dist/
          cp target/x86_64-pc-windows-msvc/release/atelierv-admin-cli.exe dist/
          cp run.bat dist/
          cp run-admin.bat dist/
          cp run-admin-cli.bat dist/
          cp README.md dist/

      - name: Upload Unified Suite Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atelierv-suite-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Release to GitHub Releases (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/atelierv.exe
            dist/atelierv-admin.exe
            dist/atelierv-admin-cli.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
