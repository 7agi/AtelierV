<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AtelierV - Commission Marketplace</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h1, h2 { color: #bb86fc; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, select, textarea, button { width: 100%; padding: 10px; margin: 8px 0; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; }
        button { background: #bb86fc; color: #121212; font-weight: bold; cursor: pointer; }
        button:hover { background: #9965f4; }
        .slot-card { background: #252525; padding: 15px; margin: 10px 0; border-radius: 6px; border-left: 4px solid #bb86fc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AtelierV Commission Marketplace</h1>
        <h2>Add Commission Slot (Digital & Physical Supported)</h2>
        <form id="slotForm">
            <input type="text" id="artist_id" placeholder="Artist ID / Username" value="artist_demo" required>
            <input type="text" id="title" placeholder="Slot Title (e.g., Digital Illustration Bust-up)" required>
            <textarea id="description" placeholder="Description & Deliverables" required></textarea>
            <input type="number" id="price" placeholder="Price ($)" step="0.01" required>
            <select id="product_type">
                <option value="digital">Digital Product / Artwork (Instant Download)</option>
                <option value="physical">Physical Merchandise</option>
            </select>
            <input type="number" id="slots_available" placeholder="Number of Slots Available" value="5" required>
            <button type="submit">Create Commission Slot</button>
        </form>

        <h2>Available Commission Slots</h2>
        <div id="slotsList">Loading...</div>
    </div>

    <script>
        async function fetchSlots() {
            const res = await fetch('/api/slots');
            const slots = await res.json();
            const list = document.getElementById('slotsList');
            if (slots.length === 0) {
                list.innerHTML = '<p>No commission slots posted yet.</p>';
                return;
            }
            list.innerHTML = slots.map(s => `
                <div class="slot-card">
                    <h3>${s.title} (${s.product_type.toUpperCase()})</h3>
                    <p>${s.description}</p>
                    <p><strong>Price:</strong> $${s.price.toFixed(2)} | <strong>Slots Left:</strong> ${s.slots_available}</p>
                    <p><small>Artist: ${s.artist_id}</small></p>
                </div>
            `).join('');
        }

        document.getElementById('slotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                artist_id: document.getElementById('artist_id').value,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                price: parseFloat(document.getElementById('price').value),
                product_type: document.getElementById('product_type').value,
                slots_available: parseInt(document.getElementById('slots_available').value)
            };

            const res = await fetch('/api/slots', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert('Commission slot created successfully!');
                document.getElementById('slotForm').reset();
                fetchSlots();
            } else {
                alert('Failed to create slot.');
            }
        });

        fetchSlots();
    </script>
</body>
</html>
